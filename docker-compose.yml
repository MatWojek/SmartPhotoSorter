services:
  mongo:
    image: mongo:6
    container_name: smartphotosorter-mongo
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example123
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "mongodb://root:example123@localhost:27017/admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: backend-app
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      MONGO_URL: mongodb://root:example123@mongo:27017/?authSource=admin
      JWT_SECRET: "supersecret"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend/app/storage:/app/app/storage
      - /home/Pictures:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data: